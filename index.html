<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزشگاه علمی نو | شبستر</title>
    <style>
        /* استایل مدرن و شیک برای سایت شما */
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 { margin: 0; color: #2c3e50; font-size: 28px; }
        .manger-name { color: #34495e; font-weight: bold; margin-top: 5px; }
        
        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }

        .contact-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.8;
            border-right: 5px solid #3498db;
        }

        .form-wrapper {
            position: relative;
            width: 100%;
            /* ارتفاع فرم را از اینجا می‌توانید تنظیم کنید */
            height: 800px; 
            overflow: hidden;
            border-radius: 15px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin: 30px 0;
            font-size: 12px;
            color: #7f8c8d;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 600px) {
            h1 { font-size: 22px; }
            .container { width: 95%; padding: 10px; }
            .form-wrapper { height: 1000px; } /* در موبایل فرم طولانی‌تر است */
        }
    </style>
</head>
<body>

    <header>
        <h1>آموزشگاه علمی نو</h1>
        <div class="manger-name">مدیریت: مهندس بهروز ریحان‌بند</div>
    </header>

    <div class="container">
        <div class="contact-info">
            📍 <strong>آدرس:</strong> شبستر، خیابان امام، روبروی نوبل تحریر، ساختمان حافظ، طبقه ۴ <br>
            📞 <strong>تماس:</strong> 09906349290 <br>
            ✨ <em>«همگام با تکنولوژی، معمار آینده‌ی دیجیتال خود باشید»</em>
        </div>

        <h2 style="text-align: center; color: #2980b9;">فرم ثبت‌نام دوره‌ها</h2>
        
        <div class="form-wrapper">
            <!-- من لینک شما را به فرمت Embed تبدیل کردم تا داخل سایت نمایش داده شود -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf8P_KImq_yX9p6lW6j9M6-t9D6YwL_xS7D-v_B5eL2n_0HAg/viewform?embedded=true">
                در حال بارگذاری فرم...
            </iframe>
        </div>
    </div>

    <footer>
        تمامی حقوق برای آموزشگاه علمی نو محفوظ است &copy; 2026
    </footer>

</body>
</html>
